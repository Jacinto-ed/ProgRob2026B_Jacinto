controller_manager:
  ros__parameters:
    update_rate: 100 # Hz
    use_sim_time: true

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    brazo_position_controller:
      type: position_controllers/JointGroupPositionController

    gripper_position_controller:
      type: position_controllers/JointGroupPositionController

joint_state_broadcaster:
  ros__parameters:
    use_sim_time: true

brazo_position_controller:
  ros__parameters:
    use_sim_time: true
    joints:
      - base_first_joint
      - first_second_joint
      - second_third_joint

gripper_position_controller:
  ros__parameters:
    use_sim_time: true
    joints:
      - gripper_base_finger_left
      - gripper_base_finger_right
